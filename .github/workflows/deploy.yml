name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            ~/deploy.sh || exit 1

            # Warm the image cache so the first visitor (and PageSpeed) doesn't wait on resizes
            sleep 10
            SITE="https://www.webtechninjas.com"
            curl -s -A "Mozilla/5.0 (Linux; Android 11)" "$SITE/" \
              | grep -o '/_next/image?url=[^" ,]*' \
              | sed 's/&amp;/\&/g' \
              | sort -u \
              | while read -r u; do
                  curl -s -o /dev/null -H "Accept: image/avif,image/webp,*/*" "$SITE$u"
                done
            echo "Image cache warmed"